<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="samityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#samityGrad)"/>
  
  <!-- Subtle inner glow / border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>
  
  <!-- Building & Hands symbol -->
  <g transform="translate(106, 96)" filter="url(#shadow)">
    <!-- Building Pillars -->
    <!-- Roof / Pediment -->
    <path d="M 150 20 L 280 90 L 20 90 Z" fill="#ffffff"/>
    
    <!-- Architrave -->
    <rect x="15" y="96" width="270" height="20" rx="4" fill="#ecfdf5"/>
    
    <!-- 4 Pillars -->
    <rect x="35" y="126" width="28" height="110" rx="4" fill="#ffffff"/>
    <rect x="100" y="126" width="28" height="110" rx="4" fill="#ffffff"/>
    <rect x="172" y="126" width="28" height="110" rx="4" fill="#ffffff"/>
    <rect x="237" y="126" width="28" height="110" rx="4" fill="#ffffff"/>
    
    <!-- Base plinth -->
    <rect x="10" y="244" width="280" height="24" rx="6" fill="#ecfdf5"/>
    
    <!-- Center Samity Coin / Circle -->
    <circle cx="150" cy="180" r="26" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <!-- Taka symbol or shield -->
    <path d="M 144 168 L 156 168 M 150 168 L 150 192 M 143 182 L 157 178" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  
  <!-- Bengali text 'সমিতি' or Badge bottom -->
  <g transform="translate(256, 420)">
    <rect x="-85" y="-24" width="170" height="44" rx="22" fill="#ffffff" fill-opacity="0.95"/>
    <text text-anchor="middle" y="7" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="700" fill="#047857">সমিতি</text>
  </g>
</svg>
